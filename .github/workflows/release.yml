name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux-x86_64:
    name: Build Linux (x86_64 Musl Static)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Musl Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools
          sudo ln -sf /usr/include/linux /usr/include/x86_64-linux-musl/linux
          sudo ln -sf /usr/include/asm-generic /usr/include/x86_64-linux-musl/asm-generic
          sudo ln -sf /usr/include/x86_64-linux-gnu/asm /usr/include/x86_64-linux-musl/asm

      - name: Restore Cached OpenSSL for x86_64 Musl
        id: cache-openssl-musl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/openssl-musl-x86_64
          key: openssl-3.2-musl-x86_64-u22

      - name: Build Static OpenSSL with Musl
        if: steps.cache-openssl-musl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src
          CC=musl-gcc ./Configure linux-x86_64 \
            no-shared no-tests no-docs no-legacy no-engine no-ui-console \
            --prefix=$GITHUB_WORKSPACE/openssl-musl-x86_64 \
            --openssldir=$GITHUB_WORKSPACE/openssl-musl-x86_64
          make -j$(nproc) build_libs
          make install_dev
          cd ..

      - name: Compile True Static Binary with Musl
        run: |
          musl-gcc -O3 -flto -fomit-frame-pointer -Wall \
            -I$GITHUB_WORKSPACE/openssl-musl-x86_64/include \
            fast.c \
            $GITHUB_WORKSPACE/openssl-musl-x86_64/lib64/libssl.a \
            $GITHUB_WORKSPACE/openssl-musl-x86_64/lib64/libcrypto.a \
            -o bb-fast-linux-x86_64 \
            -static -lpthread

          strip bb-fast-linux-x86_64
          chmod +x bb-fast-linux-x86_64
          file bb-fast-linux-x86_64
          ls -lh bb-fast-linux-x86_64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-fast-linux-x86_64
          path: bb-fast-linux-x86_64

  build-linux-cross:
    name: Build Linux (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-linux-gnu
            cross_pkg: gcc-aarch64-linux-gnu
            openssl_target: linux-aarch64
            openssl_asm_flag: ""
            cflags: "-O3 -flto -fomit-frame-pointer -march=armv8-a+crypto+crc"
          - arch: armhf
            target: arm-linux-gnueabihf
            cross_pkg: gcc-arm-linux-gnueabihf
            openssl_target: linux-armv4
            openssl_asm_flag: "no-asm"
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: armel
            target: arm-linux-gnueabi
            cross_pkg: gcc-arm-linux-gnueabi
            openssl_target: linux-armv4
            openssl_asm_flag: "no-asm"
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: mipsel
            target: mipsel-linux-gnu
            cross_pkg: gcc-mipsel-linux-gnu
            openssl_target: linux-mips32
            openssl_asm_flag: "no-asm"
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: mips
            target: mips-linux-gnu
            cross_pkg: gcc-mips-linux-gnu
            openssl_target: linux-mips32
            openssl_asm_flag: "no-asm"
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: riscv64
            target: riscv64-linux-gnu
            cross_pkg: gcc-riscv64-linux-gnu
            openssl_target: linux64-riscv64
            openssl_asm_flag: "no-asm"
            cflags: "-O3 -flto -fomit-frame-pointer"
          - arch: i686
            target: i686-linux-gnu
            cross_pkg: gcc-i686-linux-gnu
            openssl_target: linux-x86
            openssl_asm_flag: "no-asm"
            cflags: "-O3 -flto -fomit-frame-pointer -m32"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Cross Toolchain
        run: |
          sudo add-apt-repository universe -y || true
          sudo apt-get update
          sudo apt-get install -y build-essential ${{ matrix.cross_pkg }}

      - name: Restore Cached OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/openssl-target
          key: openssl-3.2-u22-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.openssl_target }}-${{ matrix.openssl_asm_flag }}

      - name: Build Static OpenSSL for Target Architecture
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git openssl-src
          cd openssl-src

          ./Configure ${{ matrix.openssl_target }} \
            --cross-compile-prefix=${{ matrix.target }}- \
            no-shared no-tests no-docs no-legacy no-engine no-ui-console ${{ matrix.openssl_asm_flag }} \
            --prefix=$GITHUB_WORKSPACE/openssl-target \
            --openssldir=$GITHUB_WORKSPACE/openssl-target

          make -j$(nproc) build_libs
          make install_dev
          cd ..

      - name: Compile Static bb-fast Binary
        run: |
          ${{ matrix.target }}-gcc ${{ matrix.cflags }} -Wall \
            -I$GITHUB_WORKSPACE/openssl-target/include \
            -L$GITHUB_WORKSPACE/openssl-target/lib \
            -L$GITHUB_WORKSPACE/openssl-target/lib64 \
            fast.c -o bb-fast-linux-${{ matrix.arch }} \
            -static -lssl -lcrypto -latomic -lpthread -ldl

          ${{ matrix.target }}-strip bb-fast-linux-${{ matrix.arch }} || true
          chmod +x bb-fast-linux-${{ matrix.arch }}
          file bb-fast-linux-${{ matrix.arch }}
          ls -lh bb-fast-linux-${{ matrix.arch }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-fast-linux-${{ matrix.arch }}
          path: bb-fast-linux-${{ matrix.arch }}

  build-macos:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install OpenSSL
        run: |
          brew install openssl@3

      - name: Compile macOS Binary
        run: |
          OPENSSL_DIR=$(brew --prefix openssl@3)
          clang -O3 -flto -fomit-frame-pointer -Wall \
            -I"${OPENSSL_DIR}/include" \
            fast.c \
            "${OPENSSL_DIR}/lib/libssl.a" \
            "${OPENSSL_DIR}/lib/libcrypto.a" \
            -o bb-fast-darwin-arm64 \
            -lpthread -lz

          strip bb-fast-darwin-arm64 || true
          chmod +x bb-fast-darwin-arm64
          file bb-fast-darwin-arm64
          otool -L bb-fast-darwin-arm64 || true
          ls -lh bb-fast-darwin-arm64

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-fast-darwin-arm64
          path: bb-fast-darwin-arm64

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-w64-mingw32
            openssl_target: mingw64
            openssl_asm_flag: ""
          - arch: arm64
            target: aarch64-w64-mingw32
            openssl_target: mingw64
            openssl_asm_flag: "no-asm"
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Restore Cached LLVM MinGW Toolchain
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: /opt/llvm-mingw
          key: llvm-mingw-20261006-ucrt-ubuntu-22.04

      - name: Install LLVM MinGW Cross-Compiler Toolchain
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y xz-utils
          URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20261006/llvm-mingw-20261006-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -sL "$URL" -o /tmp/llvm-mingw.tar.xz
          sudo mkdir -p /opt/llvm-mingw
          sudo tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          rm -f /tmp/llvm-mingw.tar.xz

      - name: Add Toolchain to PATH
        run: echo "/opt/llvm-mingw/bin" >> $GITHUB_PATH

      - name: Restore Cached OpenSSL for Windows
        id: cache-openssl-win
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/openssl-target
          key: openssl-win-3.2-u22-${{ matrix.arch }}-${{ matrix.target }}-${{ matrix.openssl_asm_flag }}

      - name: Build Static OpenSSL for Windows
        if: steps.cache-openssl-win.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 -b openssl-3.2 https://github.com/openssl/openssl.git openssl-win
          cd openssl-win

          ./Configure ${{ matrix.openssl_target }} \
            --cross-compile-prefix=${{ matrix.target }}- \
            no-shared no-tests no-docs no-legacy no-engine no-ui-console ${{ matrix.openssl_asm_flag }} \
            --prefix=$GITHUB_WORKSPACE/openssl-target \
            --openssldir=$GITHUB_WORKSPACE/openssl-target

          make -j$(nproc) build_libs
          make install_dev
          cd ..

      - name: Compile Static Windows Binary
        run: |
          ${{ matrix.target }}-clang -O3 -flto -fomit-frame-pointer -Wall \
            -I$GITHUB_WORKSPACE/openssl-target/include \
            -L$GITHUB_WORKSPACE/openssl-target/lib \
            -L$GITHUB_WORKSPACE/openssl-target/lib64 \
            fast.c -o bb-fast-windows-${{ matrix.arch }}.exe \
            -static -lssl -lcrypto -lws2_32 -lgdi32 -lcrypt32 -lbcrypt -lpthread

          ${{ matrix.target }}-strip bb-fast-windows-${{ matrix.arch }}.exe || true
          chmod +x bb-fast-windows-${{ matrix.arch }}.exe
          file bb-fast-windows-${{ matrix.arch }}.exe
          ls -lh bb-fast-windows-${{ matrix.arch }}.exe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bb-fast-windows-${{ matrix.arch }}.exe
          path: bb-fast-windows-${{ matrix.arch }}.exe

  release:
    name: Create GitHub Release
    needs: [build-linux-x86_64, build-linux-cross, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Organize Release Assets
        run: |
          mkdir -p release_files
          find dist -type f -name "bb-fast-*" -exec cp {} release_files/ \;
          cd release_files
          sha256sum * > sha256sums.txt
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_files/*
          draft: false
          prerelease: false
          generate_release_notes: true
